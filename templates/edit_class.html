{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto mt-10 bg-white rounded-lg shadow p-8">
  <h2 class="text-2xl font-bold text-gray-800 mb-6">✏️ Edit Class</h2>
  <form method="POST" action="{{ url_for('edit_class', class_id=class_rec.classID) }}">
    <div class="mb-4">
      <label for="class_name" class="block text-gray-700 font-semibold mb-2">Class Name</label>
      <input type="text" id="class_name" name="class_name" value="{{ class_rec.class_name }}" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="mb-4">
      <label for="class_group" class="block text-gray-700 font-semibold mb-2">Class Group</label>
      <input type="text" id="class_group" name="class_group" value="{{ class_rec.class_group }}" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div class="flex justify-end">
      <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 font-semibold">Save Changes</button>
      <a href="{{ url_for('manage_classes') }}" class="ml-4 bg-gray-300 text-gray-800 px-6 py-2 rounded hover:bg-gray-400 font-semibold">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
