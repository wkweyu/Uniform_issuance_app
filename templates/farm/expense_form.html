{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg border border-red-50 p-8">
        <div class="flex items-center gap-4 mb-8">
            <div class="p-3 bg-red-100 text-red-600 rounded-xl shadow-sm"><i class="fas fa-file-invoice-dollar fa-2x"></i></div>
            <div>
                <h1 class="text-2xl font-black text-gray-800 tracking-tight">Farm Expense Request</h1>
                <p class="text-red-500 font-bold uppercase text-[10px] tracking-widest leading-3 mt-1">Cost Center: Farm Activities</p>
            </div>
        </div>

        <form action="{{ url_for('farm.farm_expenses') }}" method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="space-y-2">
                <label for="activity_id" class="block text-xs font-black text-gray-500 uppercase tracking-widest pl-1">Activity Project</label>
                <div class="relative">
                    <select name="activity_id" id="activity_id" required 
                            class="w-full pl-4 pr-10 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-red-500 transition-all font-bold text-gray-700 outline-none shadow-sm appearance-none">
                        <option value="" disabled selected>— Select activity —</option>
                        {% for activity in activities %}
                        <option value="{{ activity.id }}">{{ activity.name }} (Cost Center: {{ activity.gl_expense_account }})</option>
                        {% endfor %}
                    </select>
                    <div class="absolute right-4 top-5 pointer-events-none text-red-500"><i class="fas fa-chevron-down"></i></div>
                </div>
            </div>

            <div class="space-y-2">
                <label for="category" class="block text-xs font-black text-gray-500 uppercase tracking-widest pl-1">Expense Category</label>
                <div class="relative">
                    <select name="category" id="category" required 
                            class="w-full pl-4 pr-10 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-red-500 transition-all font-bold text-gray-700 outline-none shadow-sm appearance-none">
                        <option value="Feed & Nutrition">Feed & Nutrition</option>
                        <option value="Medical & Vet">Medical & Vet</option>
                        <option value="Maintenance & Repair">Maintenance & Repair</option>
                        <option value="Labor">Labor</option>
                        <option value="Other">Other</option>
                    </select>
                    <div class="absolute right-4 top-5 pointer-events-none text-red-500"><i class="fas fa-chevron-down"></i></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="amount" class="block text-xs font-black text-gray-500 uppercase tracking-widest pl-1">Requisition Amount</label>
                    <div class="relative">
                        <span class="absolute left-4 top-4 text-red-400 font-bold"><i class="fas fa-dollar-sign"></i></span>
                        <input type="number" step="0.01" name="amount" id="amount" required placeholder="0.00"
                               class="w-full pl-10 pr-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-red-500 transition-all font-mono text-xl font-black text-red-600 outline-none shadow-sm">
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="expense_date" class="block text-xs font-black text-gray-500 uppercase tracking-widest pl-1">Spending Date</label>
                    <input type="date" name="expense_date" id="expense_date" value="{{ datetime.now().strftime('%Y-%m-%d') }}" required
                           class="w-full px-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-red-500 transition-all font-bold text-gray-600 outline-none shadow-sm">
                </div>
            </div>

            <div class="space-y-2">
                <label for="description" class="block text-xs font-black text-gray-500 uppercase tracking-widest pl-1">Expense Justification</label>
                <textarea name="description" id="description" rows="3" required placeholder="e.g., Purchase of 50kg layers mash, repair of chicken wire fence"
                          class="w-full px-4 py-4 bg-gray-50 border-2 border-gray-100 rounded-2xl focus:border-red-500 transition-all font-medium text-gray-700 outline-none shadow-sm italic"></textarea>
            </div>

            <div class="pt-6 border-t border-gray-100 flex items-center justify-between gap-4">
                <a href="{{ url_for('farm.dashboard') }}" class="px-6 py-4 text-gray-400 hover:text-gray-600 font-bold transition flex items-center gap-2">
                    <i class="fas fa-arrow-left"></i> BACK
                </a>
                <button type="submit" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-black py-4 rounded-2xl shadow-lg hover:shadow-red-200 transform hover:scale-[1.01] transition-all flex items-center justify-center gap-3">
                    POST EXPENSE REQUISITION
                    <i class="fas fa-paper-plane text-red-300 opacity-60"></i>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
