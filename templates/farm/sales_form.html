{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-xl overflow-hidden border border-gray-100">
        <div class="bg-emerald-600 px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fas fa-cash-register text-white text-2xl"></i>
                <h1 class="text-xl font-bold text-white uppercase tracking-wider">Record Income / Sale</h1>
            </div>
            <span class="bg-indigo-500 text-white text-xs font-bold px-3 py-1 rounded-full uppercase shadow-sm">Sales Log</span>
        </div>

        <form action="{{ url_for('farm.record_sale') }}" method="POST" class="p-10 space-y-8" id="sale_form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="activity_id" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-tight">Source Activity</label>
                    <select name="activity_id" id="activity_id" required 
                            class="w-full px-4 py-3 border border-emerald-100 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all bg-emerald-50 font-semibold text-emerald-900 shadow-sm border-2">
                        <option value="" disabled selected>— Select activity —</option>
                        {% for activity in activities %}
                        <option value="{{ activity.id }}">{{ activity.name }} (Units: {{ activity.unit_of_measure }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="sale_date" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-tight">Date of Sale</label>
                    <input type="date" name="sale_date" id="sale_date" value="{{ datetime.now().strftime('%Y-%m-%d') }}" required
                           class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm font-medium">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-4 border-t border-gray-50">
                <div>
                    <label for="quantity" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-tight">Qty Sold</label>
                    <div class="relative">
                        <input type="number" step="0.01" name="quantity" id="quantity" required placeholder="0.00"
                               class="w-full pl-4 pr-10 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm font-mono text-lg font-bold">
                    </div>
                </div>

                <div>
                    <label for="unit_price" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-tight">Rate / Unit</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-400 font-bold">$</span>
                        <input type="number" step="0.01" name="unit_price" id="unit_price" required placeholder="0.00"
                               class="w-full pl-8 pr-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition shadow-sm font-mono text-lg font-bold">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-tight">Total Value</label>
                    <div class="w-full px-4 py-3 bg-gray-50 border-2 border-dashed border-gray-200 rounded-lg text-emerald-700 font-mono text-lg font-black text-center" id="total_preview">
                        0.00
                    </div>
                </div>
            </div>

            <div class="pt-4">
                <label for="customer_name" class="block text-sm font-bold text-gray-700 mb-2 uppercase tracking-tight">Customer / Buyer Full Name</label>
                <div class="relative">
                    <span class="absolute left-3 top-3.5 text-blue-400"><i class="fas fa-user-tag"></i></span>
                    <input type="text" name="customer_name" id="customer_name" placeholder="Walk-in Customer / Local Merchant"
                           class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-400 outline-none transition shadow-sm italic text-gray-600">
                </div>
            </div>

            <div class="pt-8 flex flex-col md:flex-row gap-4">
                <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl shadow-lg hover:shadow-emerald-200 transform hover:-translate-y-0.5 transition active:scale-95 flex items-center justify-center gap-3">
                    <i class="fas fa-print text-emerald-200 opacity-60"></i>
                    FINALIZE & POST TO LEDGER
                </button>
                <a href="{{ url_for('farm.dashboard') }}" class="px-8 py-4 border-2 border-gray-200 text-gray-500 font-bold rounded-xl hover:bg-gray-50 hover:text-gray-700 transition flex items-center justify-center">
                    CANCEL
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const qty = document.getElementById('quantity');
        const price = document.getElementById('unit_price');
        const total = document.getElementById('total_preview');

        function updateTotal() {
            const v = (parseFloat(qty.value) || 0) * (parseFloat(price.value) || 0);
            total.textContent = v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        qty.addEventListener('input', updateTotal);
        price.addEventListener('input', updateTotal);
    });
</script>
{% endblock %}
