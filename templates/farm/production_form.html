{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100">
        <div class="bg-indigo-600 px-8 py-5 flex items-center gap-3">
            <i class="fas fa-tractor text-white text-2xl"></i>
            <h1 class="text-xl font-bold text-white">Record Farm Production</h1>
        </div>

        <form action="{{ url_for('farm.record_production') }}" method="POST" class="p-8 space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="activity_id" class="block text-sm font-semibold text-gray-700 mb-2 underline decoration-indigo-500">Select Activity</label>
                <select name="activity_id" id="activity_id" required class="w-full px-4 py-2 border-2 border-gray-100 rounded-lg focus:border-indigo-500 transition outline-none">
                    <option value="" disabled selected>— Choose activity (e.g., Dairy) —</option>
                    {% for activity in activities %}
                    <option value="{{ activity.id }}">{{ activity.name }} ({{ activity.unit_of_measure }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="quantity" class="block text-sm font-semibold text-gray-700 mb-2">Total Quantity</label>
                    <input type="number" step="0.01" name="quantity" id="quantity" required placeholder="0.00"
                           class="w-full px-4 py-2 border-2 border-gray-100 rounded-lg focus:border-indigo-500 transition outline-none">
                </div>
                <div>
                    <label for="spoilage" class="block text-sm font-semibold text-gray-700 mb-2">Spoilage / Loss</label>
                    <input type="number" step="0.01" name="spoilage" id="spoilage" value="0"
                           class="w-full px-4 py-2 border-2 border-gray-100 rounded-lg focus:border-red-500 transition outline-none">
                </div>
            </div>

            <div>
                <label for="internal_consumption" class="block text-sm font-semibold text-gray-700 mb-2">Internal (Kitchen/School) Use</label>
                <input type="number" step="0.01" name="internal_consumption" id="internal_consumption" value="0"
                       class="w-full px-4 py-2 border-2 border-gray-100 rounded-lg focus:border-blue-500 transition outline-none">
                <p class="mt-2 text-xs text-blue-600 italic font-medium"><i class="fas fa-info-circle mr-1"></i> Quantities used internally are not sold but tracked for stock offsets.</p>
            </div>

            <div>
                <label for="production_date" class="block text-sm font-semibold text-gray-700 mb-2">Date Produced</label>
                <input type="date" name="production_date" id="production_date" value="{{ datetime.now().strftime('%Y-%m-%d') }}" required
                       class="w-full px-4 py-2 border-2 border-gray-100 rounded-lg focus:border-indigo-500 transition outline-none">
            </div>

            <div>
                <label for="notes" class="block text-sm font-semibold text-gray-700 mb-2">Observations (Optional)</label>
                <textarea name="notes" id="notes" rows="2" placeholder="e.g., Morning milking, low yield due to cold"
                          class="w-full px-4 py-2 border-2 border-gray-100 rounded-lg focus:border-indigo-500 transition outline-none"></textarea>
            </div>

            <div class="pt-4 flex gap-4">
                <button type="submit" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transform hover:scale-[1.02] transition shadow-md">
                    <i class="fas fa-save mr-2"></i> Save Record
                </button>
                <a href="{{ url_for('farm.dashboard') }}" class="px-6 py-3 border-2 border-gray-100 text-gray-500 rounded-lg hover:bg-gray-50 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
