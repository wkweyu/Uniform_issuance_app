{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-2xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="bg-indigo-600 px-6 py-4">
            <h1 class="text-xl font-bold text-white">Register New Fixed Asset</h1>
        </div>
        
        <form action="{{ url_for('register_asset') }}" method="POST" class="p-6 space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Asset Name *</label>
                    <input type="text" name="asset_name" required placeholder="e.g. School Bus KBX 123, Office Laptop" 
                           class="w-full border rounded-md px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tag/Serial Number</label>
                    <input type="text" name="tag_number" placeholder="Unique ID" 
                           class="w-full border rounded-md px-3 py-2">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
                    <select name="category" required class="w-full border rounded-md px-3 py-2 bg-white">
                        <option value="FURNITURE">Furniture & Fittings</option>
                        <option value="ELECTRONICS">Electronics/ICT</option>
                        <option value="VEHICLE">Vehicles</option>
                        <option value="LAND_BUILDING">Land & Buildings</option>
                        <option value="LAB_EQUIPMENT">Lab Equipment</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Purchase Date *</label>
                    <input type="date" name="purchase_date" required value="{{ datetime.now().strftime('%Y-%m-%d') }}"
                           class="w-full border rounded-md px-3 py-2">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Purchase Value *</label>
                    <input type="number" step="0.01" name="purchase_value" required placeholder="0.00"
                           class="w-full border rounded-md px-3 py-2">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Current Location</label>
                    <input type="text" name="location" placeholder="e.g. Accounts Office" 
                           class="w-full border rounded-md px-3 py-2">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Initial Condition</label>
                    <select name="condition_status" class="w-full border rounded-md px-3 py-2 bg-white">
                        <option value="NEW">New</option>
                        <option value="GOOD">Good</option>
                        <option value="FAIR">Fair</option>
                        <option value="POOR">Poor/Damaged</option>
                    </select>
                </div>
            </div>

            <div class="pt-6 border-t flex justify-end space-x-3">
                <a href="{{ url_for('manage_assets') }}" class="px-4 py-2 border rounded text-gray-600 hover:bg-gray-50 font-medium">Cancel</a>
                <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded font-bold hover:bg-indigo-700 transition">
                    REGISTER ASSET
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
