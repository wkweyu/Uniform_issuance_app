{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center mb-8">
            <a href="{{ url_for('exams_dashboard') }}" class="w-10 h-10 flex items-center justify-center bg-white border border-gray-300 rounded-lg text-blue-600 hover:bg-blue-50 transition mr-4">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-2xl font-black text-gray-800 uppercase tracking-tight">Generate Aggregate Report</h1>
        </div>

        <form action="{{ url_for('aggregate_report_select') }}" method="POST" class="bg-white rounded-3xl shadow-xl border border-gray-100 p-8">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-8">
                <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Select Target Class</label>
                <select name="class_id" required class="w-full px-4 py-3 border-2 border-gray-100 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition font-bold text-gray-700">
                    <option value="">-- Choose Class --</option>
                    {% for c in classes %}
                    <option value="{{ c.classID }}">{{ c.display_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-8">
                <label class="block text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Select Exams to Combine (2 or 3)</label>
                <div class="grid grid-cols-1 gap-3 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                    {% for exam in exams %}
                    <label class="flex items-center p-4 bg-gray-50 rounded-xl border-2 border-transparent hover:border-blue-200 cursor-pointer transition has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500">
                        <input type="checkbox" name="exam_ids" value="{{ exam.id }}" class="w-5 h-5 rounded text-blue-600 focus:ring-blue-500 border-gray-300 mr-4">
                        <div class="flex flex-col">
                            <span class="font-black text-gray-800 uppercase text-xs">{{ exam.name }}</span>
                            <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">{{ exam.academic_year_name }} - Term {{ exam.term }}</span>
                        </div>
                    </label>
                    {% endfor %}
                </div>
                <p class="mt-4 text-[10px] text-gray-400 font-bold uppercase tracking-widest leading-relaxed">
                    <i class="fas fa-info-circle mr-1 text-blue-500"></i> Performance will be averaged across selected exams for all students in the class.
                </p>
            </div>

            <button type="submit" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-black uppercase tracking-widest hover:bg-blue-700 transition shadow-lg shadow-blue-200 transform active:scale-95 flex items-center justify-center">
                <i class="fas fa-layer-group mr-2"></i> Generate Aggregate Cards
            </button>
        </form>
    </div>
</div>

<style>
.custom-scrollbar::-webkit-scrollbar { width: 6px; }
.custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
</style>
{% endblock %}
