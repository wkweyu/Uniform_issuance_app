{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center mb-6">
            <a href="{{ url_for('exams_dashboard') }}" class="text-blue-600 hover:text-blue-800 mr-4">
                <i class="fas fa-arrow-left fa-lg"></i>
            </a>
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Edit Exam Series</h1>
                <p class="text-sm text-gray-500">{{ exam.academic_year_name }} - Term {{ exam.term }}</p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
            <form id="exam-series-form" action="{{ url_for('exams.edit_exam', exam_id=exam.id) }}" method="POST" class="p-8">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="academic_year_id" id="academic_year_id" value="{{ exam.academic_year_id }}">

                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2" for="name">
                            Exam Series Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" name="name" id="name" required value="{{ form_name|default(exam.name) }}"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition outline-none">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <span class="block text-sm font-semibold text-gray-700 mb-2">Academic Year</span>
                            <p class="h-11 flex items-center px-4 bg-gray-50 border border-gray-200 rounded-lg">
                                {{ exam.academic_year_name }}
                            </p>
                        </div>
                        <div>
                            <span class="block text-sm font-semibold text-gray-700 mb-2">Term</span>
                            <p class="h-11 flex items-center px-4 bg-gray-50 border border-gray-200 rounded-lg">
                                Term {{ exam.term }}
                            </p>
                        </div>
                    </div>

                    {% include '_exam_class_picker.html' %}
                </div>

                <div class="mt-8 pt-6 border-t border-gray-100 flex justify-end gap-3">
                    <a href="{{ url_for('exams_dashboard') }}" class="px-6 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-semibold hover:bg-gray-50 transition">
                        Cancel
                    </a>
                    <button type="submit" class="px-8 py-2.5 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-md transition transform active:scale-95">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
