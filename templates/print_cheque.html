<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cheque Print - {{ voucher.voucher_no }}</title>
    <style>
        @page {
            size: 210mm 100mm; /* Standard cheque size approx */
            margin: 0;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14pt;
            text-transform: uppercase;
        }
        .cheque-container {
            position: relative;
            width: 210mm;
            height: 100mm;
            /* border: 1px dashed #ccc; /* For preview only */
        }
        .field {
            position: absolute;
        }
        /* Adjusted positions for blank cheque layout */
        .date {
            top: 15mm;
            right: 15mm;
            letter-spacing: 4px;
        }
        .payee {
            top: 35mm;
            left: 30mm;
            font-weight: bold;
        }
        .amount-words {
            top: 48mm;
            left: 30mm;
            width: 130mm;
            line-height: 1.5;
            font-size: 11pt;
        }
        .amount-figure {
            top: 48mm;
            right: 15mm;
            font-weight: bold;
            border: 1px solid #000;
            padding: 2mm 4mm;
        }
        .no-print {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #eee;
            padding: 10px;
            border: 1px solid #ccc;
            z-index: 1000;
        }
        @media print {
            .no-print { display: none; }
            .cheque-container { border: none; }
        }
    </style>
</head>
<body onload="/* window.print() */">
    <div class="no-print">
        <button onclick="window.print()">Print Cheque</button>
        <p style="font-size: 8pt; color: #666;">Align blank cheque in printer.<br>Adjust CSS values if needed.</p>
    </div>

    <div class="cheque-container">
        <!-- Date field: DDMMYYYY -->
        <div class="field date">{{ voucher.created_at.strftime('%d%m%Y') }}</div>
        
        <!-- Payee field -->
        <div class="field payee">**{{ voucher.payee_name }}**</div>
        
        <!-- Amount in words -->
        <div class="field amount-words">{{ voucher.amount_in_words }}</div>
        
        <!-- Amount in figures -->
        <div class="field amount-figure">**{{ "{:,.2f}".format(voucher.amount) }}**</div>
    </div>
</body>
</html>
