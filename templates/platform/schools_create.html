{% extends 'base.html' %}
{% block platform_content %}
<section class="max-w-3xl space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-gray-900">Create School</h2>
    <p class="text-sm text-gray-600">Provision a tenant record directly from the control plane when you do not need the full onboarding wizard.</p>
  </div>

  <form method="post" class="space-y-6 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="grid gap-4 md:grid-cols-2">
      <label class="block text-sm font-medium text-gray-700">
        School Name
        <input type="text" name="name" required class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
      </label>
      <label class="block text-sm font-medium text-gray-700">
        School Code
        <input type="text" name="code" required class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm uppercase">
      </label>
      <label class="block text-sm font-medium text-gray-700">
        Timezone
        <input type="text" name="timezone" value="UTC" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
      </label>
      <label class="block text-sm font-medium text-gray-700">
        Subscription End
        <input type="date" name="subscription_end" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
      </label>
    </div>

    <label class="inline-flex items-center gap-3 text-sm font-medium text-gray-700">
      <input type="checkbox" name="is_active" value="1" checked class="h-4 w-4 rounded border-gray-300 text-green-600">
      School is active immediately
    </label>

    <div class="flex items-center gap-3">
      <button type="submit" class="rounded-lg bg-green-600 px-4 py-2 text-sm font-semibold text-white hover:bg-green-700">Create School</button>
      <a href="{{ url_for('platform.list_schools') }}" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:border-gray-400">Back to Schools</a>
    </div>
  </form>
</section>
{% endblock %}
