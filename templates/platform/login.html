{% extends 'base.html' %}
{% block login_content %}
<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-blue-600 text-white mb-4 shadow-lg shadow-blue-200">
        <i class="fas fa-microchip text-xl"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Platform Login</h1>
      <p class="text-slate-500 mt-2 text-sm">Sign in to access the control plane.</p>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
      <form method="post" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Internal Email</label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input name="email" type="email" required placeholder="name@skooltrack.pro" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-10 py-3 text-sm transition-all focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Secret Key</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input name="password" type="password" required placeholder="••••••••" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-10 py-3 text-sm transition-all focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10">
          </div>
        </div>
        <button type="submit" class="w-full rounded-xl bg-blue-600 py-3.5 text-sm font-bold text-white shadow-lg shadow-blue-200 transition-all hover:bg-blue-700 hover:shadow-blue-300">
          Sign In
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-slate-500">
        Authorized platform operators only.
      </div>
    </div>
    
    <div class="text-center mt-8">
      <a href="{{ url_for('index') }}" class="text-xs font-bold text-slate-400 hover:text-blue-600 transition-colors">
        <i class="fas fa-arrow-left mr-2"></i>Back to School App
      </a>
    </div>
  </div>
</div>
{% endblock %}
