{% extends 'base.html' %}
{% block content %}
<h2>Platform Login</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Email</label>
  <input name="email" type="email" required>
  <label>Password</label>
  <input name="password" type="password" required>
  <button type="submit">Login</button>
</form>
{% endblock %}
