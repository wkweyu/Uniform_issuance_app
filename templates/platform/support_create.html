{% extends 'base.html' %}
{% block platform_content %}
<section class="max-w-3xl mx-auto space-y-6">
  <div>
    <h2 class="text-2xl font-bold text-gray-900">Create Support Ticket</h2>
    <p class="text-sm text-gray-600">Log a tenant issue and route it into the platform support queue.</p>
  </div>

  <form method="post" class="space-y-4 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">School</label>
      <select name="school_id" title="Select school for support ticket" aria-label="Select school for support ticket" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm">
        {% for school in schools %}
        <option value="{{ school.id }}">{{ school.name }} ({{ school.code }})</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Contact Email</label>
      <input type="email" name="email" title="Support contact email" aria-label="Support contact email" placeholder="family@example.com" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" required>
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Subject</label>
      <input type="text" name="subject" title="Support ticket subject" aria-label="Support ticket subject" placeholder="Portal login issue" class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" required>
    </div>
    <div>
      <label class="mb-1 block text-sm font-medium text-gray-700">Description</label>
      <textarea name="description" rows="6" title="Support ticket description" aria-label="Support ticket description" placeholder="Describe the issue and current impact." class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm" required></textarea>
    </div>
    <div class="flex justify-end gap-2">
      <a href="{{ url_for('platform.list_tickets') }}" class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 hover:border-gray-400">Cancel</a>
      <button type="submit" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">Create Ticket</button>
    </div>
  </form>
</section>
{% endblock %}
