{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded shadow-md mt-8">
  <h2 class="text-2xl font-bold mb-6 text-center">Create New User</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="mb-4 text-red-600 text-center">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" class="space-y-4">
    {{ csrf_token() }}
    <div>
      <label class="block mb-1 font-semibold">Staff ID</label>
      <input type="text" name="staff_id" class="w-full border px-3 py-2 rounded">
    </div>

    <div>
      <label class="block mb-1 font-semibold">Username <span class="text-red-500">*</span></label>
      <input type="text" name="username" required class="w-full border px-3 py-2 rounded">
    </div>

    <div>
      <label class="block mb-1 font-semibold">Password <span class="text-red-500">*</span></label>
      <input type="password" name="password" required class="w-full border px-3 py-2 rounded">
    </div>

    <div class="flex items-center space-x-2">
      <input type="checkbox" name="is_admin" value="1" id="is_admin">
      <label for="is_admin">Admin User</label>
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
      Create User
    </button>
  </form>
</div>
{% endblock %}
