{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <div class="flex items-center mb-6">
            <a href="{{ url_for('exams_dashboard') }}" class="text-blue-600 hover:text-blue-800 mr-4">
                <i class="fas fa-arrow-left fa-lg"></i>
            </a>
            <h1 class="text-2xl font-bold text-gray-800">Create New Exam Series</h1>
        </div>

        <div class="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
            <form action="{{ url_for('create_exam') }}" method="POST" class="p-8">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2" for="name">
                            Exam Series Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" name="name" id="name" required placeholder="e.g. 2026 Term 1 Mid-Term Exam"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition outline-none">
                        <p class="mt-1 text-xs text-gray-400">Unique name identifying this specific exam series.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2" for="academic_year_id">
                                Academic Year <span class="text-red-500">*</span>
                            </label>
                            <select name="academic_year_id" id="academic_year_id" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition outline-none h-11">
                                {% for year in years %}
                                <option value="{{ year.id }}" {{ 'selected' if year.is_current }}>{{ year.year }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2" for="term">
                                Term <span class="text-red-500">*</span>
                            </label>
                            <select name="term" id="term" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition outline-none h-11">
                                <option value="1">Term 1</option>
                                <option value="2">Term 2</option>
                                <option value="3">Term 3</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Select Participating Classes <span class="text-red-500">*</span>
                        </label>
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 max-h-64 overflow-y-auto">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {% for cls in all_classes %}
                                <label class="flex items-center space-x-3 p-2 hover:bg-white rounded border border-transparent hover:border-blue-200 cursor-pointer transition">
                                    <input type="checkbox" name="class_ids" value="{{ cls.classID }}" class="w-4 h-4 text-blue-600 rounded">
                                    <span class="text-sm text-gray-700">{{ cls.display_name }}</span>
                                </label>
                                {% endfor %}
                            </div>
                        </div>
                        <p class="mt-1 text-xs text-gray-400 italic">Select one or more classes that will participate in this exam series.</p>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-gray-100 flex justify-end gap-3">
                    <a href="{{ url_for('exams_dashboard') }}" class="px-6 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-semibold hover:bg-gray-50 transition">
                        Cancel
                    </a>
                    <button type="submit" class="px-8 py-2.5 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-md transition transform active:scale-95">
                        Create Exam Series
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
