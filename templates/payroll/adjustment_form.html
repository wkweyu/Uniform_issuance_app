{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">New Payroll Adjustment</h1>

    <form method="POST" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-5">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Employee</label>
            <select name="employee_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">-- Select Employee --</option>
                {% for e in employees %}
                <option value="{{ e.id }}">{{ e.surname or '' }} {{ e.firstname or '' }} ({{ e.staff_id }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                <select name="type" required class="w-full border border-gray-300 rounded-lg px-3 py-2">
                    <option value="earning">Earning (addition)</option>
                    <option value="deduction">Deduction</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Name / Description</label>
                <input type="text" name="name" required placeholder="e.g. Overtime pay, Salary advance"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Amount (KSh)</label>
                <input type="number" step="0.01" name="amount" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div class="flex items-end gap-4 pb-1">
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="is_taxable" value="1"> Taxable
                </label>
                <label class="flex items-center gap-2 text-sm">
                    <input type="checkbox" name="is_recurring" value="1" id="recurring-cb"> Recurring
                </label>
            </div>
        </div>

        <div id="recur-until-row" class="hidden">
            <label class="block text-sm font-medium text-gray-700 mb-1">Recur Until</label>
            <input type="date" name="recur_until"
                   class="w-full md:w-1/2 border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Notes (optional)</label>
            <textarea name="notes" rows="2" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">Create Adjustment</button>
            <a href="{{ url_for('payroll.adjustments') }}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">Cancel</a>
        </div>
    </form>
</div>

<script>
document.getElementById('recurring-cb').addEventListener('change', function() {
    document.getElementById('recur-until-row').classList.toggle('hidden', !this.checked);
});
</script>
{% endblock %}
