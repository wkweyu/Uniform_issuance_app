{% extends "base.html" %}
{% block content %}
<div class="container mx-auto px-4 py-8 max-w-3xl">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ 'Edit Employee' if employee else 'Add Employee to Payroll' }}</h1>

    <form method="POST" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        {% if not employee %}
        <!-- Staff selection for new records -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Staff Member</label>
            <select name="staff_id" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">-- Select Staff --</option>
                {% for s in staff_list %}
                <option value="{{ s.staffID }}">{{ s.surname }} {{ s.firstname }} ({{ s.staffID }})</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Basic Salary (KSh)</label>
                <input type="number" step="0.01" name="basic_salary" value="{{ employee.basic_salary if employee else '' }}" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Salary Source</label>
                <select name="salary_source" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="school" {% if employee and employee.salary_source == 'school' %}selected{% endif %}>School</option>
                    <option value="government" {% if employee and employee.salary_source == 'government' %}selected{% endif %}>Government (TSC)</option>
                    <option value="mixed" {% if employee and employee.salary_source == 'mixed' %}selected{% endif %}>Mixed</option>
                </select>
            </div>
        </div>

        <div id="govt-pct-row" class="{% if not employee or employee.salary_source != 'mixed' %}hidden{% endif %}">
            <label class="block text-sm font-medium text-gray-700 mb-1">Government Salary % (for mixed)</label>
            <input type="number" step="0.01" name="govt_salary_pct" value="{{ employee.govt_salary_pct if employee else 0 }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div class="border-t pt-4">
            <h3 class="text-md font-semibold text-gray-700 mb-3">Statutory Numbers</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">KRA PIN</label>
                    <input type="text" name="kra_pin" value="{{ employee.kra_pin or '' if employee else '' }}" placeholder="A0123456789B"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">NHIF / SHIF No.</label>
                    <input type="text" name="nhif_no" value="{{ employee.nhif_no or '' if employee else '' }}"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">NSSF No.</label>
                    <input type="text" name="nssf_no" value="{{ employee.nssf_no or '' if employee else '' }}"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>
        </div>

        <div class="border-t pt-4">
            <h3 class="text-md font-semibold text-gray-700 mb-3">Bank Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Bank Name</label>
                    <input type="text" name="bank_name" value="{{ employee.bank_name or '' if employee else '' }}"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Branch</label>
                    <input type="text" name="bank_branch" value="{{ employee.bank_branch or '' if employee else '' }}"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Account No.</label>
                    <input type="text" name="bank_account" value="{{ employee.bank_account or '' if employee else '' }}"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Effective From</label>
            <input type="date" name="effective_from" value="{{ employee.effective_from.strftime('%Y-%m-%d') if employee and employee.effective_from else '' }}"
                   class="w-full md:w-1/3 border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition">{{ 'Update' if employee else 'Add to Payroll' }}</button>
            <a href="{{ url_for('payroll.employees') }}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">Cancel</a>
        </div>
    </form>
</div>

<script>
document.querySelector('[name=salary_source]').addEventListener('change', function() {
    document.getElementById('govt-pct-row').classList.toggle('hidden', this.value !== 'mixed');
});
</script>
{% endblock %}
