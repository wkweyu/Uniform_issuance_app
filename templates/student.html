{% extends "base.html" %}
{% block content %}

<div class="max-w-2xl mx-auto">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">👤 Admit New Student</h1>
    <p class="text-gray-600 mt-1">Register a new student with basic details</p>
  </div>

  <!-- Form Card -->
  <div class="bg-white border border-gray-200 rounded-lg shadow p-6">
    <form method="POST" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Admission Number -->
      <div class="bg-blue-50 border-l-4 border-blue-500 p-4">
        <label class="block text-sm font-bold text-blue-900 mb-2">Admission Number *</label>
        <input type="text" name="admno" required placeholder="e.g., ADM001, STU-2026-001" 
               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent font-semibold">
        <p class="text-xs text-blue-700 mt-2">Enter manually. Must be unique for each student.</p>
      </div>

      <!-- Student Names -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">First Name *</label>
          <input type="text" name="fname" required placeholder="John"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Middle Name</label>
          <input type="text" name="mname" placeholder="Peter"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Last Name *</label>
          <input type="text" name="lname" required placeholder="Doe"
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
        </div>
      </div>

      <!-- Gender -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Gender *</label>
        <div class="flex gap-4">
          <label class="flex items-center">
            <input type="radio" name="gender" value="M" required class="w-4 h-4">
            <span class="ml-2 text-sm">Male</span>
          </label>
          <label class="flex items-center">
            <input type="radio" name="gender" value="F" class="w-4 h-4">
            <span class="ml-2 text-sm">Female</span>
          </label>
        </div>
      </div>

      <!-- Class Selection -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Assign Class *</label>
        <select name="class_id" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500">
          <option value="">-- Select Class --</option>
          {% for c in classes %}
          <option value="{{ c.classID }}">{{ c.class_name }}</option>
          {% endfor %}
        </select>
        <p class="text-xs text-gray-500 mt-2">Classes are managed in <a href="{{ url_for('manage_classes') }}" class="text-blue-600 hover:underline">Admin Settings → Manage Classes</a></p>
      </div>

      <!-- Buttons -->
      <div class="flex gap-3 pt-4 border-t">
        <button type="submit" class="flex-1 px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium">
          ✓ Admit Student
        </button>
        <a href="{{ url_for('students_list') }}" class="flex-1 px-6 py-2 bg-gray-400 text-white rounded-md hover:bg-gray-500 text-center font-medium">
          Cancel
        </a>
      </div>
    </form>
  </div>

  <!-- Quick Links -->
  <div class="mt-6 grid grid-cols-2 gap-4 text-center text-sm">
    <a href="{{ url_for('students_list') }}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded text-gray-700">📋 View All Students</a>
    <a href="{{ url_for('manage_classes') }}" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded text-gray-700">⚙️ Manage Classes</a>
  </div>
</div>

{% endblock %}
