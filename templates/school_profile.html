{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-school mr-2"></i> School Profile</h1>
        <a href="{{ url_for('auth.admin_settings') }}" class="text-indigo-600 hover:underline text-sm"><i class="fas fa-arrow-left"></i> Back to Settings</a>
    </div>

    <form method="POST" enctype="multipart/form-data" class="bg-white rounded-2xl shadow-sm border p-6 space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Current Logo Preview -->
        <div class="flex items-center gap-6">
            <div class="w-24 h-24 rounded-xl border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden bg-gray-50">
                {% if settings.logo %}
                <img src="{{ url_for('static', filename=settings.logo) }}" alt="Logo" class="w-full h-full object-contain">
                {% else %}
                <i class="fas fa-image text-3xl text-gray-300"></i>
                {% endif %}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">School Logo</label>
                <input type="file" name="logo" accept="image/png,image/jpeg,image/gif,image/webp,image/svg+xml"
                       class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <p class="text-xs text-gray-400 mt-1">PNG, JPG, SVG — max 2 MB</p>
            </div>
        </div>

        <!-- School Name -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">School Name <span class="text-red-500">*</span></label>
            <input type="text" name="school_name" value="{{ settings.school_name or '' }}" required
                   class="w-full border rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <!-- Address -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Address / P.O. Box</label>
            <input type="text" name="address" value="{{ settings.address or '' }}"
                   class="w-full border rounded-lg px-4 py-2.5 text-sm" placeholder="P.O. Box 12345 - 50200, Bungoma">
        </div>

        <!-- Phone + Email row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                <input type="text" name="phone" value="{{ settings.phone or '' }}"
                       class="w-full border rounded-lg px-4 py-2.5 text-sm" placeholder="+254 700 000 000">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" value="{{ settings.email or '' }}"
                       class="w-full border rounded-lg px-4 py-2.5 text-sm" placeholder="info@school.edu">
            </div>
        </div>

        <!-- Website + Currency row -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Website</label>
                <input type="text" name="website" value="{{ settings.website or '' }}"
                       class="w-full border rounded-lg px-4 py-2.5 text-sm" placeholder="www.school.edu">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Currency</label>
                <select name="currency" class="w-full border rounded-lg px-4 py-2.5 text-sm">
                    {% for c in ['KES', 'USD', 'GBP', 'EUR', 'UGX', 'TZS', 'ZAR'] %}
                    <option value="{{ c }}" {{ 'selected' if (settings.currency or 'KES') == c }}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="pt-2">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg hover:bg-blue-700 transition text-sm font-medium">
                <i class="fas fa-save mr-1"></i> Save Profile
            </button>
        </div>
    </form>
</div>
{% endblock %}
